<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="flyers.css">
<style>
  body{width:1080px;height:1080px;}
  .bg{object-position:34% 42%;}
  .scrim{background:linear-gradient(90deg,
    rgba(10,10,11,.96) 0%, rgba(10,10,11,.9) 44%, rgba(10,10,11,.55) 70%, rgba(10,10,11,.3) 100%);}
  .wrap{position:absolute;left:72px;right:420px;top:0;bottom:150px;z-index:46;
    display:flex;flex-direction:column;justify-content:center;}
  .chip{font-size:14px;padding:11px 20px;align-self:flex-start;}
  .rule{width:84px;height:6px;background:var(--red);margin:30px 0 24px;}
  h1{font-size:54px;}
  h1 .l2{display:block;}
  .trust{margin-top:38px;display:flex;flex-direction:column;gap:22px;}
  .t{display:flex;gap:18px;align-items:flex-start;}
  .t .sq{width:12px;height:12px;background:var(--red);flex:none;margin-top:11px;}
  .t p{font-size:22.5px;line-height:1.4;color:var(--w60);font-weight:500;}
  .t b{color:#fff;font-weight:800;}
  .footer-band{height:118px;display:flex;align-items:center;padding:0 72px;gap:34px;}
  .fb-url{font-size:28px;font-weight:700;}
  .fb-mid{flex:1;font-size:15.5px;}
</style></head>
<body>
<div class="stage">
  <img class="bg" src="bg/bg-projector.png">
  <div class="scrim"></div>
  <div class="topbar"></div>

  <div class="wrap">
    <div class="chip"><span class="sq"></span>DeYoung Original</div>
    <div class="rule"></div>
    <h1 class="display">ONE SENTENCE IN.<br><span class="grad-red">A REAL FILM OUT.</span></h1>
    <div class="trust">
      <div class="t"><span class="sq"></span><p>Up to <b>60 seconds in one pass</b> — others stop at 15.</p></div>
      <div class="t"><span class="sq"></span><p>Pay <b>local or international</b> — bank, mobile money or card.</p></div>
      <div class="t"><span class="sq"></span><p><b>Replies within 24 hours</b> — real studio, real people.</p></div>
    </div>
  </div>

  <div class="footer-band">
    <div class="mono fb-url">deyoungltd.site</div>
    <div class="kicker fb-mid">Bold work. Real results.</div>
    <div class="wordmark" style="font-size:26px;">DEY<span class="g">OUNG</span></div>
  </div>
  <div class="grain"></div>
</div>
</body></html>
