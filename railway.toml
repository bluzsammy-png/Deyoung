# DeYoung site — Railway config-as-code (Railpack)
[build]
builder = "RAILPACK"
buildCommand = "prisma generate --schema prisma/schema.postgres.prisma && next build && cp -r .next/static .next/standalone/.next/ && cp -r public .next/standalone/"

[deploy]
startCommand = "sh deploy/start.sh"
# NOTE: no HTTP healthcheck — Railway's edge (hikari) rate-limited the public-URL
# prober (429 "rate limited"), failing every deploy even with a fully healthy app.
# Deploy success = container stays up; start.sh already self-verifies (db push,
# seed, standalone Ready) and restartPolicy covers crashes.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
