# gitleaks config — DeYoung repo
# Extends the default rules; allowlists below are placeholders/test values only.
# Real secrets must NEVER be added here — rotate them instead.

title = "DeYoung gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "known placeholders and negative-test values"
paths = [
  '''(^|/)spec_parts/''',
  '''worklog\.md$''',
]
# W41: Kaggle ACCOUNT NAMES are public identifiers (profiles), not secrets.
# "wikeyoung5" contains the substring "key" which trips generic-api-key when a
# colon follows in prose ("...wikeyoung5. Quota model: deyoungsltd/teslaprime").
# Real KGAT_/dyw_ tokens can never contain these strings.
stopwords = [
  "deyoungsltd",
  "teslaprime",
  "jimcreat",
  "bittrexminingltd",
  "youngwilly",
  "wikeyoung5",
]
regexes = [
  # negative-test dummy in the QA script (deliberately invalid)
  '''dyw_dummy-negative-test''',
  '''dyw_totallywrong''',
  # redaction markers left by the W0 history purge
  '''REDACTED-C2''',
  '''C1-ROTATED-REMOVED''',
  '''C2-ROTATED-REMOVED''',
  # redaction markers left by the W1 C-6 history purge (old Supabase DB password + project ref)
  '''REDACTED-C6-DB-PASSWORD''',
  '''REDACTED-C6-OLD-PROJ-REF''',
  # documentation truncations of the agentmail key prefix (prefix is not secret)
  '''am_us_…''',
]

# W3.0 (Task 62-d): cookie jars are live session material — never commit them.
# The S-1 incident (brain/admin_cookie_58.txt, purged in 62-c) was exactly this
# shape: a libcurl jar with a session token landed in the public repo and lived
# there for days. These rules catch the jar header and any #HttpOnly_ entry.
[[rules]]
id = "netscape-cookie-jar"
description = "Netscape HTTP Cookie File (live session jar) committed to the repo"
regex = '''# Netscape HTTP Cookie File'''
keywords = ["netscape http cookie file"]

[[rules]]
id = "curl-httponly-jar-entry"
description = "curl cookie jar #HttpOnly_ entry committed to the repo"
regex = '''#HttpOnly_[^\t\r\n]+\t'''
keywords = ["#httponly_"]
