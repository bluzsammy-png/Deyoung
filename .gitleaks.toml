# gitleaks config — DeYoung repo
# Extends the default rules; allowlists below are placeholders/test values only.
# Real secrets must NEVER be added here — rotate them instead.

title = "DeYoung gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "known placeholders and negative-test values"
paths = [
  '''(^|/)spec_parts/''',
  '''worklog\.md$''',
]
regexes = [
  # negative-test dummy in the QA script (deliberately invalid)
  '''dyw_dummy-negative-test''',
  '''dyw_totallywrong''',
  # redaction markers left by the W0 history purge
  '''REDACTED-C2''',
  '''C1-ROTATED-REMOVED''',
  '''C2-ROTATED-REMOVED''',
  # redaction markers left by the W1 C-6 history purge (old Supabase DB password + project ref)
  '''REDACTED-C6-DB-PASSWORD''',
  '''REDACTED-C6-OLD-PROJ-REF''',
  # documentation truncations of the agentmail key prefix (prefix is not secret)
  '''am_us_…''',
]
