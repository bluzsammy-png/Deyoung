[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pati"
version = "1.0.0"
description = "PATI - Personal AI Tool Infrastructure: zero-cost AI infrastructure layer with control plane, local agent, free GPU workers, SDK and MCP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "PATI Owner" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "psutil>=5.9",
]

[project.optional-dependencies]
kaggle = ["kaggle>=1.6"]
gdrive = ["google-api-python-client>=2.100", "google-auth>=2.23", "google-auth-oauthlib>=1.1"]
dev = ["pytest>=8.0", "pytest-timeout>=2.3", "ruff>=0.4"]

[project.scripts]
pati = "pati.cli:main"
pati-server = "pati_api.__main__:main"
pati-agent = "pati_agent.__main__:main"
pati-mcp = "pati_mcp.server:main"

[tool.setuptools]
packages = [
    "pati_api", "pati_api.routers",
    "pati", "pati.adapters",
    "pati_agent",
    "pati_workers",
    "pati_connectors",
    "pati_mcp",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
filterwarnings = ["ignore::DeprecationWarning"]
