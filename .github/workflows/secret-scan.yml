name: secret-scan

# W0 fix (spec §I.4 item 5): gitleaks on every push/PR so committed secrets are
# caught in CI before they land in public history again (C-1/C-2 incident, 2026-09).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the scan covers every commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
