name: fleet-doctor
# Task 63 — sandbox-immune render-fleet control plane (runs the repo's own
# doctor scripts; public repo = free Actions minutes).
#
# ARMING (once, owner/agent): set repo secrets LIGHTNING_API_KEY + WORKER_TOKEN,
# then either run it manually (Actions -> fleet-doctor -> Run) or uncomment the
# schedule below for automatic every-5-min supervision.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "ensure | status | stop"
        default: "ensure"
  schedule:
    - cron: "*/5 * * * *"   # ARMED (Task 64): secrets set; ensure-mode starts studio only when queue has work

permissions:
  contents: read

concurrency:
  group: fleet-doctor
  cancel-in-progress: false

jobs:
  doctor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIGHTNING_API_KEY: ${{ secrets.LIGHTNING_API_KEY }}
      WORKER_TOKEN: ${{ secrets.WORKER_TOKEN }}
      # Task 65 — free fallback plane: one Kaggle account is enough here; the
      # sandbox brain rotates the FULL vault (kaggle_tokens.json) on its own.
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KAGGLE_USER: ${{ secrets.KAGGLE_USER }}
      # Task 68 — new API planes (secrets set via sealed-box API; env wiring was
      # blocked during the Task-67 push freeze, completed in Task 69).
      BAIDU_AISTUDIO_TOKEN: ${{ secrets.BAIDU_AISTUDIO_TOKEN }}
      MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install fleet deps
        run: pip install requests lightning-sdk kaggle
      - name: Run fleet doctor
        run: python scripts/fleet_doctor_actions.py "${{ github.event.inputs.mode || 'ensure' }}"
