# Task 47 — production self-test for the AI studio tools.
# Manual dispatch only (workflow_dispatch). The runner calls the LIVE site
# exactly as the owner's browser would: admin login -> /api/me -> enhance ->
# script -> verify real content. The admin password arrives via the dispatch
# client_payload (never stored in this repo) and is masked in logs.
name: prod-selftest
on:
  workflow_dispatch:
    inputs:
      base:
        description: "Site base URL"
        required: false
        default: "https://deyoungltd.site"
      pass:
        description: "Admin password (transient, masked)"
        required: true

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run production self-test
        env:
          ADMIN_PASS: ${{ github.event.inputs.pass }}
          BASE: ${{ github.event.inputs.base }}
        run: bash scripts/prod_selftest.sh
      - name: Summary
        if: always()
        run: echo "PROD SELFTEST COMPLETE — see step result above"
